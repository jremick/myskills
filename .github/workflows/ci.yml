name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-supported-node:
    name: Check / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run check

  # Preserve the existing required `check` context while making it aggregate
  # supported Node lines, integration jobs, and the exact Railway image builds.
  check:
    name: check
    if: always()
    needs: [check-supported-node, railway-images, web-e2e, postgres-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require supported Node, integration, and Railway image checks
        env:
          NODE_RESULT: ${{ needs.check-supported-node.result }}
          RAILWAY_IMAGES_RESULT: ${{ needs.railway-images.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
        run: |
          test "$NODE_RESULT" = "success"
          test "$RAILWAY_IMAGES_RESULT" = "success"
          test "$WEB_E2E_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"

  web-e2e-supported-node:
    name: Web E2E / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @myskills-app/web
      - name: Run production-like API and web journey
        run: npm run test:e2e:fullstack

  # Preserve the protected-branch context while testing both supported Node lines.
  web-e2e:
    name: web-e2e
    if: always()
    needs: [web-e2e-supported-node]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported browser job
        env:
          WEB_E2E_RESULT: ${{ needs.web-e2e-supported-node.result }}
        run: test "$WEB_E2E_RESULT" = "success"

  railway-images:
    name: Railway images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Railway API image
        run: docker build --file Dockerfile.api --tag myskills-app-api:ci .
      - name: Build Railway web image
        run: docker build --file Dockerfile.web --build-arg VITE_API_BASE_URL=/api --tag myskills-app-web:ci .

  postgres-supported-node:
    name: Postgres / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: myskills_test
          POSTGRES_PASSWORD: myskills_test
          POSTGRES_DB: myskills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myskills_test -d myskills_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://myskills_test:myskills_test@localhost:5432/myskills_test

  # Preserve the protected-branch context while testing both supported Node lines.
  postgres-integration:
    name: postgres-integration
    if: always()
    needs: [postgres-supported-node]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported PostgreSQL job
        env:
          POSTGRES_RESULT: ${{ needs.postgres-supported-node.result }}
        run: test "$POSTGRES_RESULT" = "success"
