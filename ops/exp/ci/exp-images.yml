name: EXP images

on:
  push:
    branches: [exp-migration]
    paths:
      - ops/exp/Dockerfile.*
      - ops/exp/nginx*
      - ops/exp/start-proxy.sh
      - ops/exp/build/**
      - .github/workflows/exp-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: exp-images-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_BASE_SHA: 3deeb95e442353e67446fd83f79055959f4a54ab

jobs:
  image:
    if: github.repository == 'jremick/myskills' && github.ref == 'refs/heads/exp-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, backup]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved application source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_BASE_SHA" HEAD
          git diff --exit-code "$SOURCE_BASE_SHA" HEAD -- . \
            ':!ops/exp' ':!.github/workflows/exp-images.yml'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ops/exp/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jremick/myskills-exp-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            MYSKILLS_BUILD_REVISION=${{ github.sha }}
            VITE_API_BASE_URL=/api
          labels: |
            org.opencontainers.image.source=https://github.com/jremick/myskills
            org.opencontainers.image.revision=${{ github.sha }}
            me.jarel.exp.source-base=${{ env.SOURCE_BASE_SHA }}
          provenance: mode=max
      - name: Save image and record digest, image ID and archive checksum
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/jremick/myskills-exp-${{ matrix.component }}
          IMAGE_TAG: ghcr.io/jremick/myskills-exp-${{ matrix.component }}:${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash ops/exp/build/export-image.sh
      - name: Upload offline transfer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myskills-exp-${{ matrix.component }}-${{ github.sha }}
          path: image-artifact/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
