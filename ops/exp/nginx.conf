worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $sent_http_content_type $myskills_content_cache_control {
    default "";
    "~^text/html(?:;|$)" "no-cache";
  }
  map $uri $myskills_cache_control {
    default $myskills_content_cache_control;
    /index.html "no-cache";
    /version.json "no-store";
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 14m;
    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 172.30.40.2;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://plausible.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $myskills_cache_control always;

    # Cloudflare is the only ingress. Replace client-supplied forwarding headers.
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location / {
      try_files $uri $uri/ /index.html;
    }
    location /api/ {
      proxy_pass http://172.30.40.4:3001/;
    }
    location = /api {
      return 308 /api/;
    }
    location = /.well-known/oauth-authorization-server {
      proxy_pass http://172.30.40.4:3001/.well-known/oauth-authorization-server;
    }
    location /oauth/ {
      proxy_pass http://172.30.40.4:3001/oauth/;
    }
    location ^~ /.well-known/oauth-protected-resource {
      return 404;
    }
    location = /mcp {
      return 404;
    }
    location ^~ /mcp/ {
      return 404;
    }
    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
    location = /version.json {
      try_files $uri =404;
    }
  }
}
